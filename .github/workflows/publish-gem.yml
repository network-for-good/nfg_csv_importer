name: Publish gem to GitHub Packages

# Triggered by merges to main rather than a manually-pushed gem-v* tag, so
# releasing no longer depends on a human bumping the version, tagging, and
# running bin/publish_gem locally (see the Releasing section in README.md).
#
# Whether a merge "warrants a release" is decided by the version bump
# itself: the versioning policy (README.md's Versioning section) is a
# human judgment call tied to the Rails series this gem supports, not
# something derivable from commit messages, so a PR author bumps
# lib/nfg_csv_importer/version.rb as part of their change when a release
# is warranted. This workflow just checks whether that version has already
# been published (a gem-v<version> tag already exists) and skips publishing
# a merge that didn't change it.
#
# Runs with the workflow's own GITHUB_TOKEN, which (unlike a personal
# access token) is allowed to create a brand-new package under this repo
# even when org policy restricts members from creating packages
# themselves, and (with contents: write below) can push the release tag
# itself.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'

      - name: Check whether this version was already published
        id: check
        run: |
          VERSION="$(ruby -r ./lib/nfg_csv_importer/version -e 'puts NfgCsvImporter::VERSION')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/gem-v${VERSION}" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure gem credentials
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials <<CREDS
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          CREDS
          chmod 0600 ~/.gem/credentials

      - name: Build and publish
        if: steps.check.outputs.publish == 'true'
        run: bin/publish_gem

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "gem-v${{ steps.check.outputs.version }}"
          git push origin "gem-v${{ steps.check.outputs.version }}"
