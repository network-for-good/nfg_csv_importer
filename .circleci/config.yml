# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2
jobs:
  build:
    docker:
      - image: cimg/ruby:3.4.2-browsers
        environment:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ""
          NODE_ENV: test
          PAGER: cat
          RAILS_ENV: test
          TZ: /usr/share/zoneinfo/US/Eastern
          DISABLE_SPRING: true
      - image: cimg/postgres:11.12
        environment:
          POSTGRES_HOST_AUTH_METHOD: trust
      - image: cimg/redis:6.2.6

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v3-dependencies-{{ checksum "Gemfile.lock" }}
          # fallback to using the latest cache if no exact match is found
          - v3-dependencies-

      - run:
          name: install dependencies
          command: |
            gem install bundler -v 2.4.22
            bundle install --jobs=4 --retry=3 --path vendor/bundle

      - save_cache:
          paths:
            - ./vendor/bundle
          key: v3-dependencies-{{ checksum "Gemfile.lock" }}

      # Database setup
      - run: cp spec/test_app/config/api-keys.yml.example spec/test_app/config/api-keys.yml
      - run: cp spec/test_app/config/redis.yml-example spec/test_app/config/redis.yml
      - run: cd spec/test_app && bundle exec rake db:create db:migrate db:schema:load

      # Precompile assets
      - run:
          name: precompile assets
          command: |
            cd spec/test_app && bundle exec rake assets:precompile

      - run:
          name: flakey specs
          command: |
            mkdir /tmp/test-results
            bundle exec rspec --tag "flakey" \
                              --format documentation \
                              --format RspecJunitFormatter \
                              --out /tmp/test-results/rspec.xml

      # run tests!
      - run:
          name: run tests
          command: |
            bundle exec rspec --tag "~flakey" --tag "~exclude_from_circle" --format progress \
                            --format RspecJunitFormatter \
                            --out /tmp/test-results/rspec.xml

      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

workflows:
  version: 2
  build:
    jobs:
      - build:
          context: nfg-ruby-context
